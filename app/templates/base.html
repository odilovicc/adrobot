<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adrobot{% endblock %}</title>
  <script>
    // Apply the saved/system theme before paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("adrobot-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body>
<a class="visually-hidden-focusable skip-link" href="#main">К содержимому</a>
{% set t = tracker %}
{% set section = section | default("") %}
<header class="app-header sticky-top">
  <nav class="container-xxl d-flex align-items-center gap-3" aria-label="Основная навигация">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><i class="bi bi-diagram-3"></i></span>Adrobot</a>
    <ul class="nav-links">
      <li><a href="/" class="{{ 'active' if section == 'campaigns' }}" {% if section == 'campaigns' %}aria-current="page"{% endif %}><i class="bi bi-list-ul"></i> Кампании</a></li>
      <li><a href="/campaigns/new" class="{{ 'active' if section == 'new' }}" {% if section == 'new' %}aria-current="page"{% endif %}><i class="bi bi-plus-square"></i> Новая кампания</a></li>
    </ul>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if t.is_mock %}
        <span class="tracker tracker-mock" title="Приложение работает с локальным mock Keitaro — изменения никуда не уходят">
          <span class="dot" aria-hidden="true"></span>Mock Keitaro
        </span>
      {% else %}
        <a class="tracker tracker-live" href="{{ t.admin_url }}" target="_blank" rel="noopener" title="Реальный Keitaro: Push меняет кампании в трекере">
          <span class="dot" aria-hidden="true"></span><span class="d-none d-md-inline">Live:</span> {{ t.host }}
        </a>
      {% endif %}
      <button type="button" class="btn btn-icon" id="theme-toggle" aria-label="Переключить тему">
        <i class="bi bi-moon-stars theme-dark-hide" aria-hidden="true"></i><i class="bi bi-sun theme-light-hide" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</header>
<main id="main" class="container-xxl py-4" tabindex="-1">
  {% block content %}{% endblock %}
</main>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="/static/app.js?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
