{% for stream in campaign.streams %}
  {% include "_stream.html" %}
{% else %}
  <div class="empty card">
    <i class="bi bi-diagram-2" aria-hidden="true"></i>
    <h2 class="h6 mb-1">В кампании нет потоков</h2>
    <p class="text-secondary mb-0">Создайте поток в Keitaro и нажмите Fetch.</p>
  </div>
{% endfor %}
{% if campaign.fetched_at %}
  <p class="text-secondary small mt-2 mb-0"><i class="bi bi-clock-history" aria-hidden="true"></i>
    Загружено из Keitaro <time data-local datetime="{{ campaign.fetched_at.strftime('%Y-%m-%dT%H:%M:%SZ') }}">{{ campaign.fetched_at.strftime('%Y-%m-%d %H:%M:%S') }} UTC</time></p>
{% endif %}
